<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNO Online – No Mercy & Flip</title>
<style>
:root{--bg:#0a0a0b;--panel:#141416;--bd:#2a2a2e;--fg:#f4f4f5;--mut:#8b8b93;--R:#ff3b47;--Y:#ffc61a;--G:#2ed16b;--B:#2f8cff;--K:#1a1a1d;--P:#ff4fa3;--T:#19d3c5;--O:#ff8a1f;--U:#9b6bff;--cur:var(--R);--hd:"Barlow Condensed","Arial Narrow",Impact,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
.glow{position:fixed;left:50%;top:-25vmax;width:75vmax;height:50vmax;margin-left:-37vmax;border-radius:50%;background:var(--cur);opacity:.22;filter:blur(100px);pointer-events:none;transition:background-color .8s;animation:breathe 7s ease-in-out infinite}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px)}
#app{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:16px}
h1{font:900 46px/1 var(--hd);text-transform:uppercase;letter-spacing:.03em;margin:0 0 14px;animation:rise .6s both}
h1 span{color:var(--R);margin-left:10px;text-shadow:0 0 24px var(--R)}
.box{background:linear-gradient(160deg,#1a1a1d,#101012);border:1px solid var(--bd);border-radius:20px;padding:24px;max-width:440px;margin:28px auto;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:rise .6s .1s both}
.mut{color:var(--mut)}label{display:block;font:700 13px var(--hd);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:12px 0 4px}
input{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;font:inherit;background:#0c0c0e;color:var(--fg);transition:border-color .2s,box-shadow .2s}
input:focus{outline:0;border-color:var(--R);box-shadow:0 0 0 3px rgba(255,59,71,.25)}
button{font:700 17px var(--hd);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border:1px solid var(--bd);background:#1c1c20;color:var(--fg);padding:12px 16px;border-radius:12px;width:100%;margin-top:10px;transition:transform .15s,box-shadow .2s,background .2s}
button:not(:disabled):hover{transform:translateY(-2px);background:#26262b}
button:not(:disabled):active{transform:scale(.97)}
button.pri{position:relative;overflow:hidden;background:var(--R);color:#0a0a0b;border-color:var(--R);font-size:20px}
button.pri:not(:disabled):hover{background:#ff5560;box-shadow:0 10px 34px -6px var(--R)}
button.pri::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 3.2s infinite}
button:disabled{opacity:.4;cursor:default}
.or{text-align:center;color:var(--mut);margin:16px 0 0;font-family:var(--hd);letter-spacing:.2em;text-transform:uppercase}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top button{width:auto;margin:0;padding:6px 14px;font-size:15px}
.pls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.pl{padding:6px 14px;border-radius:999px;border:2px solid var(--bd);background:var(--panel);font:700 16px var(--hd);letter-spacing:.05em;text-transform:uppercase;transition:all .3s}
.pl b{margin-left:8px;background:#fff;color:#000;border-radius:999px;padding:1px 9px;font-size:14px}
.pl b.w{background:var(--R);color:#fff;animation:pulse 1s infinite}
.pl.on{border-color:var(--cur);box-shadow:0 0 20px -2px var(--cur);animation:pulse 1.6s infinite}
.pl.out{opacity:.35;text-decoration:line-through}
.table{display:flex;gap:26px;justify-content:center;align-items:center;padding:28px 10px;border:1px solid var(--bd);border-radius:28px;background:radial-gradient(ellipse at center,#222228,#0e0e10 75%);box-shadow:inset 0 0 60px rgba(0,0,0,.6),0 20px 50px rgba(0,0,0,.5);transition:background .8s,border-color .8s}
.table.dark{background:radial-gradient(ellipse at center,#33194f,#0a0512 75%);border-color:#5a3490}
.table.flip{animation:flip .9s ease}
.table button{width:auto;margin:0;padding:0;border:0;background:none;border-radius:12px}
.table button:not(:disabled) .card.back{animation:throb 1.3s infinite}
.card{position:relative;width:64px;height:96px;border-radius:12px;background:var(--c,var(--K));border:3px solid #fff;color:#fff;font-family:var(--hd);font-weight:900;box-shadow:0 8px 18px rgba(0,0,0,.55);flex:none;overflow:hidden;user-select:none}
.card::before{content:"";position:absolute;left:-22%;right:-22%;top:15%;bottom:15%;background:#fff;border-radius:50%;transform:rotate(-30deg)}
.card span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:38px;line-height:1;color:var(--c);text-shadow:0 1px 0 rgba(0,0,0,.35),0 0 8px rgba(0,0,0,.18);z-index:1}
.card.s span{font-size:21px}
.card i{position:absolute;z-index:1;font:900 14px var(--hd);font-style:normal;top:3px;left:6px}
.card i.b{top:auto;left:auto;bottom:3px;right:6px;transform:rotate(180deg)}
.card.W::before{background:conic-gradient(var(--R) 0 25%,var(--Y) 0 50%,var(--G) 0 75%,var(--B) 0)}
.card.W.dk::before{background:conic-gradient(var(--P) 0 25%,var(--T) 0 50%,var(--O) 0 75%,var(--U) 0)}
.card.W span{color:#fff;text-shadow:0 0 4px #000,0 0 8px #000}
.card.back{background:#101012;border-color:#3a3a40}
.card.back::before{background:var(--R)}
.card.back span{color:#fff;font-size:20px;letter-spacing:1px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.tc.pop{animation:land .5s cubic-bezier(.2,.9,.3,1.3)}
.dot{width:22px;height:22px;border-radius:50%;display:inline-block;vertical-align:middle;border:2px solid #fff;box-shadow:0 0 16px 2px var(--cur);transition:background .4s}
.hand{--cw:64px;display:flex;flex-wrap:nowrap;justify-content:center;padding:40px 8px 10px;margin:6px 0}
.hand button{--rot:calc(var(--k)*3.2deg);--y:calc(var(--k)*var(--k)*1.6px);width:auto;margin:0;padding:0;border:0;background:none;border-radius:12px;flex:none;transform:translateY(var(--y)) rotate(var(--rot));transition:translate .2s,rotate .2s,scale .2s,filter .2s}
.hand button+button{margin-left:calc(-1 * max(12px, (var(--n) * var(--cw) - 100%) / (var(--n) - 1)))}
.hand button:disabled{filter:brightness(.42) saturate(.6)}
.hand button:not(:disabled){translate:0 -12px}
.hand button:not(:disabled):active{transform:translateY(var(--y)) rotate(var(--rot))}
.hand button:not(:disabled):hover{transform:translateY(var(--y)) rotate(var(--rot));translate:0 -32px;rotate:calc(var(--rot) * -1);scale:1.12;z-index:5;background:none}
.hand button.in{animation:deal .55s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:calc(var(--i)*70ms)}
.status{text-align:center;font:800 24px var(--hd);letter-spacing:.08em;text-transform:uppercase;margin:12px 0}
.status.me{color:var(--cur);text-shadow:0 0 18px var(--cur);animation:blink 1.2s infinite}
.banner{background:linear-gradient(90deg,#b3121f,var(--R),#b3121f);color:#fff;border-radius:12px;padding:10px;text-align:center;margin:12px 0;font:800 20px var(--hd);letter-spacing:.05em;text-transform:uppercase;animation:pulse 1s infinite}
.pick{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.pick button{width:56px;height:56px;border-radius:50%;margin:0;border:3px solid #fff;background:var(--c);box-shadow:0 0 18px -2px var(--c);animation:rise .3s both}
.pick button.t{width:auto;height:auto;border-radius:12px;background:#1c1c20;border:1px solid var(--bd);padding:10px 16px;color:var(--fg);box-shadow:none}
.log{font-size:13px;color:var(--mut);text-align:center}
.code{font:900 64px var(--hd);letter-spacing:.3em;text-align:center;margin:8px 0;padding-left:.3em;animation:rise .5s both;text-shadow:0 0 30px var(--R)}
details{margin-top:16px;font-size:14px;color:var(--mut)}li{margin:3px 0}summary{cursor:pointer;font:700 15px var(--hd);letter-spacing:.1em;text-transform:uppercase}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes deal{from{opacity:0;transform:translateY(-160px) rotate(-20deg) scale(.5)}to{opacity:1;transform:translateY(var(--y)) rotate(var(--rot))}}
@keyframes land{from{opacity:0;transform:translateY(120px) rotate(28deg) scale(1.3)}to{opacity:1;transform:none}}
@keyframes flip{0%{transform:perspective(900px) rotateY(0)}50%{transform:perspective(900px) rotateY(90deg)}100%{transform:perspective(900px) rotateY(0)}}
@keyframes pulse{50%{filter:brightness(1.3)}}
@keyframes blink{50%{opacity:.55}}
@keyframes throb{50%{transform:scale(1.07) rotate(-2deg)}}
@keyframes shine{to{left:130%}}
@keyframes breathe{50%{opacity:.3;transform:scale(1.08)}}
@media(max-width:560px){.hand{--cw:54px}h1{font-size:36px}.card{width:54px;height:81px}.card span{font-size:32px}.card.s span{font-size:18px}.table{gap:14px}.code{font-size:48px}}
.mc,.fly{position:relative;display:block;width:24px;height:38px;background:url(cards/light.png) no-repeat 0 0/1200% 600%;transform:rotate(var(--r,0deg));flex:none;margin-left:-14px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.card.sp{width:auto!important;aspect-ratio:152/242;background:url(cards/light.png) no-repeat;background-size:1200% 600%;background-position:calc(var(--cx)*100%/11) calc(var(--cy)*100%/5);border:0;border-radius:0;overflow:visible;box-shadow:none;filter:hue-rotate(var(--hue,0deg)) drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.card.sp.b{background-image:url(cards/dark.png)}
.card.sp.n{background-image:url(cards/nomercy.png)}
.card.sp::before{display:none}
.pn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 34px var(--hd);color:#fff;text-shadow:0 0 6px #000,0 0 14px #000}
.tmr{margin-left:8px;color:var(--R);font-size:14px}.tmr:empty{display:none}
.popup{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;pointer-events:none;padding:20px}
.popup div{background:#141416;border:3px solid var(--R);border-radius:20px;padding:22px 38px;text-align:center;font:900 40px/1.1 var(--hd);text-transform:uppercase;box-shadow:0 0 80px rgba(255,59,71,.55);animation:popin .4s cubic-bezier(.2,1.4,.4,1),popout .4s 2.6s forwards}
.popup small{display:block;margin-top:8px;font:600 15px var(--hd);letter-spacing:.12em;color:var(--mut)}
.edge{position:fixed;inset:0;pointer-events:none;z-index:95;box-shadow:inset 0 0 0 8px var(--fc),inset 0 0 120px 24px var(--fc);animation:edge .85s ease-out forwards}
body.warn::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:90;box-shadow:inset 0 0 0 6px var(--R),inset 0 0 90px 10px rgba(255,59,71,.55);animation:pulse 1s infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
@keyframes popin{from{transform:scale(.3) rotate(-6deg);opacity:0}}
@keyframes popout{to{opacity:0;transform:scale(.9)}}
@keyframes edge{from{opacity:1}to{opacity:0}}
@media(min-width:561px){
.hand{--cw:78px;padding-top:62px;padding-bottom:14px}
.hand .card{width:78px;height:117px}
.hand .card span{font-size:46px}.hand .card.s span{font-size:25px}.hand .card i{font-size:17px}
.hand button{--rot:calc(var(--k)*min(5.5deg,52deg/max(1,var(--n) - 1)));--y:calc(var(--k)*var(--k)*min(3px,90px/max(1,var(--n)*var(--n)/4)))}
.hand button+button{margin-left:calc(-1*max(24px,(var(--n)*var(--cw) - 100%)/(var(--n) - 1)))}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.arena{position:relative;width:100%;aspect-ratio:1/.85;max-height:64vh;margin:10px auto 34px}
.felt{position:absolute;inset:12% 7%;border-radius:50%;background:#2b2b30;border:6px solid var(--cur);box-shadow:none;display:flex;align-items:center;justify-content:center;transition:background .5s,border-color .5s}
.felt.dark{background:#34353b}
.felt.flip{animation:flipflat .7s ease}
@keyframes flipflat{50%{transform:scaleX(.04)}}
.ring{position:absolute;left:7%;top:7%;width:86%;height:86%;overflow:visible;pointer-events:none}
.ring ellipse{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:12 12;stroke-linecap:round;opacity:.35;animation:dash 1.1s linear infinite}
.ring.rev ellipse{animation-direction:reverse}
.mid{position:relative;display:flex;gap:16px;align-items:center;z-index:1}
.mid button{width:auto;margin:0;padding:0;border:0;background:none;border-radius:12px}
.mid button:not(:disabled) .card{animation:throb 1.3s infinite}
.info{text-align:center;font:700 14px/1.5 var(--hd);letter-spacing:.1em;text-transform:uppercase;color:#fff;text-shadow:0 1px 4px #000}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;z-index:2;transition:opacity .3s}
.seat.out{opacity:.35}.seat .pl{background:#141416;white-space:nowrap}
.seat.on .pl{border-color:var(--cur);box-shadow:0 0 22px -2px var(--cur);animation:pulse 1.6s infinite}
.fan{display:flex;justify-content:center;height:38px;padding-left:14px}
.fly{position:fixed;left:0;top:0;margin:0;z-index:60;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:560px){.arena{aspect-ratio:1/1.1}.felt{inset:13% 3%}.seat .pl{font-size:13px;padding:4px 9px}.mc,.fly{width:20px;height:30px;margin-left:-12px}.fan{height:30px}.mid{gap:10px}}
</style>
<meta name="theme-color" content="#0a0a0b">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<body>
<div class="glow"></div><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COL={R:'Rot',Y:'Gelb',G:'Grün',B:'Blau',P:'Pink',T:'Türkis',O:'Orange',U:'Lila'};
const VAL={D:2,Q:4,F:4,A:6,T:10,N:1,H:2,V:5};const IM={};const fc=(g,c)=>g.side?{c:c.C,v:c.V}:c;
const LBL={D:'+2',Q:'+4',R:'⇄',S:'⊘',E:'⊘ Alle',X:'Alle ✖',F:'⇄ +4',A:'+6',T:'+10',L:'🎲',N:'+1',V:'+5',Z:'⟲ Flip',W:'★',H:'+2',K:'+Farbe'};
const NAME={D:'+2',Q:'+4',R:'Richtungswechsel',S:'Aussetzen',E:'Alle aussetzen',X:'Alle Farbe ablegen',F:'Richtungswechsel +4',A:'+6',T:'+10',L:'Farbroulette',N:'+1',V:'+5',Z:'Flip',W:'Wild',H:'Wild +2',K:'Wild +Farbe'};
const seen={h:0,d:0,s:0,c:{},k:0,o:{},col:'',afk:0};let mode='all',db=null,uid=null,code='',unsub=null,G=null,name='',pending=null;
try{name=localStorage.getItem('uno-name')||''}catch(e){}

/* ---------- Spiellogik ---------- */
function mkDeck(){const d=[],add=(c,v,n)=>{for(let i=0;i<n;i++)d.push({c,v})};
 for(const c of 'RYGB'){for(let i=0;i<=9;i++)add(c,''+i,2);for(const v of 'DQRSEX')add(c,v,2)}
 add('W','F',8);add('W','A',8);add('W','T',4);add('W','L',8);return d}
function mkFlip(){const L=[],D=[],add=(a,c,v,n)=>{for(let i=0;i<n;i++)a.push({c,v})};
 for(const c of 'RYGB'){for(let i=1;i<=9;i++)add(L,c,''+i,2);for(const v of 'NRSZ')add(L,c,v,2)}
 for(const c of 'PTOU'){for(let i=1;i<=9;i++)add(D,c,''+i,2);for(const v of 'VREZ')add(D,c,v,2)}
 shuf(D);const d=L.map((x,k)=>({c:x.c,v:x.v,C:D[k].c,V:D[k].v}));
 for(let i=0;i<4;i++)d.push({c:'W',v:'W',C:'W',V:'K'},{c:'W',v:'H',C:'W',V:'W'});return d}
function mkAll(){const L=[],D=[],wl=[],wd=[],add=(a,c,v,n)=>{for(let i=0;i<n;i++)a.push({c,v})};
 for(const c of 'RYGB'){for(let i=0;i<=9;i++)add(L,c,''+i,2);for(const v of 'DQRSEXNZ')add(L,c,v,2)}
 for(const c of 'PTOU'){for(let i=0;i<=9;i++)add(D,c,''+i,2);for(const v of 'DQRSEXVZ')add(D,c,v,2)}
 shuf(D);const d=L.map((x,k)=>({c:x.c,v:x.v,C:D[k].c,V:D[k].v}));
 [['F',8],['A',8],['T',4],['L',8]].forEach(([v,n])=>{add(wl,'W',v,n);add(wd,'W',v,n)});
 add(wl,'W','W',4);add(wl,'W','H',4);add(wd,'W','W',4);add(wd,'W','K',4);
 shuf(wd);wl.forEach((x,k)=>d.push({c:'W',v:x.v,C:'W',V:wd[k].v}));return d}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function draw(g,n){const out=[];while(n--){if(!g.deck.length){const t=g.discard.pop();g.deck=shuf(g.discard.splice(0));g.discard=[t]}
 if(!g.deck.length)break;out.push(g.deck.pop())}return out}
const ok=(g,c)=>{const x=fc(g,c),t=fc(g,g.discard.at(-1));return x.c==='W'||x.c===g.color||x.v===t.v};
const can=(g,c)=>g.pen>0?!!VAL[fc(g,c).v]:ok(g,c);
const at=(g,k)=>{let i=g.turn;const n=g.players.length;while(k-->0){do{i=(i+g.dir+n)%n}while(g.players[i].out)}return i};
const desc=c=>c.c==='W'?NAME[c.v]:COL[c.c]+' '+(NAME[c.v]||c.v);
const ref=()=>db.doc('games/'+code);
async function put(g){const b=g.v||0;g.v=b+1;g.log=g.log.slice(-6);try{if(await ref().set(g,b)===false)msg('Zu spät – der Spielstand wurde schon aktualisiert')}catch(e){msg('Speichern fehlgeschlagen')}}
function msg(t){const m=$('#msg');if(m)m.textContent=t}
function chk(g){ // Mercy-Regel: ab 25 Karten ausgeschieden
 g.players.forEach(p=>{if(g.mode!=='flip'&&!p.out&&g.hands[p.id].length>=25){p.out=true;g.deck.unshift(...g.hands[p.id]);g.hands[p.id]=[];g.log.push(p.name+' scheidet aus (25+ Karten)!')}});
 const al=g.players.filter(p=>!p.out);if(al.length===1&&g.status==='playing'){g.status='done';g.winner=al[0].name}}

async function enter(c,create){
 code=c.toUpperCase();const r=ref();const s=await r.get();
 if(create){if(s.exists)return msg('Code schon vergeben, bitte nochmal');
  await r.set({code,host:uid,mode:create,side:0,status:'lobby',players:[{id:uid,name,out:false}],hands:{},deck:[],discard:[],turn:0,dir:1,color:'R',pen:0,penv:0,winner:'',log:['Spiel erstellt'],v:0})}
 else{if(!s.exists)return msg('Kein Spiel mit diesem Code gefunden');
  const g=s.data();
  if(!g.players.some(p=>p.id===uid)){
   if(g.status!=='lobby'||g.players.length>=8)return msg('Beitritt nicht möglich (läuft schon oder voll)');
   g.players.push({id:uid,name,out:false});g.log.push(name+' ist beigetreten');await put(g)}}
 unsub&&unsub();unsub=r.onSnapshot(sn=>{G=sn.exists?sn.data():null;render()},()=>msg('Verbindung unterbrochen'));
}
async function start(){
 const g=structuredClone(G);g.deck=shuf(g.mode==='flip'?mkFlip():g.mode==='nm'?mkDeck():mkAll());g.side=0;g.hands={};
 g.players.forEach(p=>{p.out=false;g.hands[p.id]=draw(g,7)});
 let t;do{t=g.deck.pop();if(t.c==='W')g.deck.unshift(t)}while(t.c==='W');
 g.discard=[t];g.color=t.c;g.turn=0;g.dir=1;g.pen=0;g.penv=0;g.drew=false;g.afk=null;g.status='playing';g.winner='';g.log=['Spiel gestartet'];await put(g)}

async function play(i,o={}){
 const g=structuredClone(G);if(g.status!=='playing'||g.players[g.turn].id!==uid)return;
 const me=g.players[g.turn],raw=g.hands[uid][i];if(!raw||!can(g,raw))return;const c=fc(g,raw);
 g.hands[uid].splice(i,1);g.discard.push(raw);
 let m=me.name+' spielt '+desc(c),step=1;const al=g.players.filter(p=>!p.out).length;
 if(c.c==='W'){g.color=o.col;m+=' → '+COL[o.col]}else g.color=c.c;
 if(c.v==='X'){const k=g.hands[uid].filter(x=>fc(g,x).c===c.c);g.hands[uid]=g.hands[uid].filter(x=>fc(g,x).c!==c.c);g.discard.splice(g.discard.length-1,0,...k);m+=' (+'+k.length+' abgelegt)'}
 if(!g.hands[uid].length){g.status='done';g.winner=me.name;g.log.push(m+' – und gewinnt!');return put(g)}
 if(VAL[c.v]){g.pen=(g.pen||0)+VAL[c.v];g.penv=VAL[c.v];m+=' → Strafe '+g.pen}
 if(c.v==='F'||c.v==='R'){if(al===2){if(c.v==='R')step=2}else g.dir*=-1}
 if(c.v==='S')step=2;
 if(c.v==='E')step=al;
 if(c.v==='L'||c.v==='K'){const v=g.players[at(g,1)];let n=0;for(;;){const [x]=draw(g,1);if(!x)break;g.hands[v.id].push(x);n++;if(fc(g,x).c===o.col)break}m+=' – '+v.name+' zieht '+n;step=2}
 if(IM[c.v]){const v=g.players[at(g,1)];g.hands[v.id].push(...draw(g,IM[c.v]));m+=' – '+v.name+' zieht '+IM[c.v];step=2}
 if(c.v==='Z'){g.side=1-g.side;g.color=fc(g,raw).c;m+=' – Flip! Jetzt '+(g.side?'Dark':'Light')+' Side'}
 if(c.v==='0'&&g.mode!=='flip'){const P=g.players.filter(p=>!p.out),H=P.map(p=>g.hands[p.id]);P.forEach((p,k)=>g.hands[P[(k+g.dir+P.length)%P.length].id]=H[k]);m+=' – alle geben ihre Karten weiter'}
 if(c.v==='7'&&o.p){const t=g.players.find(p=>p.id===o.p);[g.hands[uid],g.hands[o.p]]=[g.hands[o.p],g.hands[uid]];m+=' – tauscht mit '+t.name}
 if(g.hands[uid].length===1)m+=' – UNO!';
 g.log.push(m);g.drew=false;chk(g);if(g.status==='playing')g.turn=at(g,step);await put(g)}
async function takePen(){
 const g=structuredClone(G);if(g.status!=='playing'||g.players[g.turn].id!==uid||!(g.pen>0))return;
 g.hands[uid].push(...draw(g,g.pen));g.log.push(g.players[g.turn].name+' zieht '+g.pen+' Strafkarten');g.pen=0;g.penv=0;chk(g);
 if(g.status==='playing')g.turn=at(g,1);await put(g)}
async function drawOne(){ // genau eine Karte ziehen, jederzeit auf eigenem Zug
 const g=structuredClone(G);if(g.status!=='playing'||g.players[g.turn].id!==uid||g.pen>0||g.drew)return;
 const me=g.players[g.turn],[x]=draw(g,1);if(x)g.hands[uid].push(x);
 g.log.push(me.name+' zieht eine Karte');chk(g);
 if(g.status==='playing'){if(!me.out&&x&&can(g,x))g.drew=true;else g.turn=at(g,1)}

/* ---------- Oberfläche ---------- */
const SA={Y:12,R:25,B:38,G:51},SB={O:12,P:25,U:38,T:51},CA={Y:2,R:3,B:4,G:5},CB={O:2,P:3,U:4,T:5};
const OA={'1':0,'2':1,'3':2,'4':3,'5':4,'6':5,'7':6,'8':7,'9':8,'0':9,D:10,S:11,R:12};
const OB={'1':0,'2':1,'3':2,'4':3,'5':4,'6':5,'7':6,'8':7,'9':8,Z:9,V:10,E:11,R:12};
const CI={Y:0,R:1,B:2,G:3},DC={O:'Y',P:'R',U:'B',T:'G'},DH={O:-20,P:-30,U:60,T:50},LZ={Y:'O',R:'P',B:'U',G:'T'},LH={Y:20,R:30,B:-60,G:-50};
const NM={E:16,Q:20,X:48,L:24,F:29,A:36,T:41}; // Sheet n (No Mercy): Startindex je Kartentyp, danach Y,R,B,G
function spr(g,f,top){ // -> [Sheet, Index, Farbton-Drehung] oder null (dann eigenes Design)
 const d=!!g.side;
 if(f.c==='W'){
  if(f.v==='W')return d?['b',top?CB[g.color]:1]:['a',top?CA[g.color]:1];
  if(d&&f.v==='K')return['b',top?CB[g.color]+5:6];
  const b=NM[f.v];if(b===undefined||'EQX'.includes(f.v))return null;
  return top?['n',b+1+CI[d?DC[g.color]:g.color],d?DH[g.color]:0]:['n',b]}
 const lc=d?DC[f.c]:f.c,h=d?DH[f.c]:0;
 if(d){
  if(OB[f.v]!==undefined)return['b',SB[f.c]+OB[f.v]];
  if('EQX'.includes(f.v))return['n',NM[f.v]+CI[lc],h];
  if(OA[f.v]!==undefined)return['a',SA[lc]+OA[f.v],h];
  return null}
 if(OA[f.v]!==undefined)return['a',SA[f.c]+OA[f.v]];
 if('EQX'.includes(f.v))return['n',NM[f.v]+CI[f.c]];
 if(f.v==='Z')return['b',SB[LZ[f.c]]+9,LH[f.c]];
 return null}
const face=(c,top)=>{const f=fc(G,c),l=LBL[f.v]||f.v,k=l.length>2?'':l,sp=spr(G,f,top);if(sp)return `<div class="card sp ${sp[0]}" style="--cx:${sp[1]%12};--cy:${sp[1]/12|0};--hue:${sp[2]||0}deg"></div>`;return `<div class="card ${f.c==='W'?'W':''} ${G.side?'dk':''} ${l.length>2?'s':''}" style="--c:var(--${f.c==='W'?'K':f.c})"><i>${k}</i><span>${l}</span><i class="b">${k}</i></div>`};
function getName(){name=($('#nm').value||'').trim().slice(0,14);if(!name){msg('Bitte gib einen Namen ein');return false}
 try{localStorage.setItem('uno-name',name)}catch(e){}return true}

let afkFor=0,afkAt=0,afkBusy=false;
const srv=()=>Date.now()+off;
async function afk(){ // 1 Minute inaktiv: +10 Karten (plus offene Strafe) und Zug überspringen
 const g=structuredClone(G);if(g.status!=='playing')return;
 const p=g.players[g.turn],n=10+(g.pen||0);
 g.hands[p.id].push(...draw(g,n));g.pen=0;g.penv=0;g.drew=false;
 g.afk={name:p.name,n,t:srv()};g.log.push(p.name+' ist AFK (+'+n+')');
 chk(g);if(g.status==='playing')g.turn=at(g,1);await put(g)}
function tick(){
 document.querySelectorAll('.tmr').forEach(e=>e.textContent='');
 if(!G||G.status!=='playing'||!G.ts)return;
 const el=srv()-G.ts,rem=Math.ceil((60000-el)/1000),t=document.querySelector('.seat.on .tmr');
 if(t&&rem>0&&rem<=30)t.textContent='⏱ '+rem+'s';
 if(afkFor!==G.ts){afkFor=G.ts;afkAt=60000+Math.random()*1500}
 if(el>=afkAt&&!afkBusy){afkBusy=true;afk().finally(()=>{afkBusy=false})}}
setInterval(tick,1000);
function popup(t,sub){const e=document.createElement('div');e.className='popup';e.innerHTML=`<div>${esc(t)}<small>${esc(sub)}</small></div>`;document.body.appendChild(e);setTimeout(()=>e.remove(),3100)}
function flash(c){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const e=document.createElement('div');e.className='edge';e.style.setProperty('--fc','var(--'+c+')');document.body.appendChild(e);setTimeout(()=>e.remove(),900)}
function fitRing(){const r=$('.ring');if(!r)return;const b=r.getBoundingClientRect(),e=r.firstElementChild;r.setAttribute('viewBox','0 0 '+b.width+' '+b.height);e.setAttribute('cx',b.width/2);e.setAttribute('cy',b.height/2);e.setAttribute('rx',Math.max(1,b.width/2-2));e.setAttribute('ry',Math.max(1,b.height/2-2))}
addEventListener('resize',fitRing);
function fly(a,b,d){
 if(!a||!b||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const A=a.getBoundingClientRect(),B=b.getBoundingClientRect(),e=document.createElement('div');e.className='fly';document.body.appendChild(e);
 const x0=A.left+A.width/2-13,y0=A.top+A.height/2-19,x1=B.left+B.width/2-13,y1=B.top+B.height/2-19;
 e.animate([{transform:`translate(${x0}px,${y0}px) rotate(0deg) scale(1)`},{transform:`translate(${(x0+x1)/2}px,${(y0+y1)/2-40}px) rotate(200deg) scale(1.3)`,offset:.5},{transform:`translate(${x1}px,${y1}px) rotate(360deg) scale(1)`}],{duration:650,delay:d,easing:'cubic-bezier(.3,.7,.3,1)',fill:'backwards'}).onfinish=()=>e.remove()}
function flights(sn,cnt){
 const pile=$('#pile'),mid=$('.tc');if(!pile||!mid)return;
 const fresh=!sn.d,dd=sn.k-G.deck.length,played=!fresh&&G.discard.length>sn.d;
 G.players.forEach((p,i)=>{if(p.id===uid)return;const s=$('#s-'+i),o=sn.c[p.id]||0,n=cnt[p.id];
  if(fresh)for(let j=0;j<Math.min(n,7);j++)fly(pile,s,j*90+i*45);
  else if(n>o&&dd>0)for(let j=0;j<Math.min(n-o,6);j++)fly(pile,s,j*110);
  else if(n<o&&played)for(let j=0;j<Math.min(o-n,3);j++)fly(s,mid,j*120)})}
function render(){document.body.classList.remove('warn');
 const A=$('#app');
 if(!db||!uid){A.innerHTML='<div class="box"><h1>UNO<span>No Mercy</span></h1><p class="mut">Keine Verbindung zum Server. Bitte lade die Seite neu.</p></div>';return}
 const rules=`<details><summary>Kartenregeln</summary><ul><li><b>Zieh-Karten</b> (+1, +2, +4, +5, +6, +10, ⇄ +4): Alle stapeln untereinander, auch +2 auf +4. Wer keine hat, zieht alles.</li><li><b>⇄ +4</b> (Wild): Richtungswechsel und +4, stapelbar.</li><li><b>⊘ Aussetzen</b>, <b>⊘ Alle</b>: Alle anderen werden übersprungen, du bist nochmal dran.</li><li><b>Alle ✖</b>: Legt alle Karten dieser Farbe aus deiner Hand ab.</li><li><b>🎲 Farbroulette</b>: Nächster zieht, bis die gewählte Farbe kommt, und setzt aus.</li><li><b>7</b>: Hände mit einem Mitspieler tauschen. <b>0</b>: Alle geben ihre Hand in Spielrichtung weiter.</li><li>Du kannst jederzeit genau eine Karte ziehen. Passt sie, darfst du sie legen, sonst ist der Nächste dran.</li><li><b>AFK</b>: Wer länger als 1 Minute für seinen Zug braucht, bekommt +10 Karten (plus eine offene Strafe) und wird übersprungen.</li><li><b>Mercy</b>: Wer 25 oder mehr Karten hat, scheidet aus.</li></ul><p><b>Flip:</b> Zwei Seiten (Light: Rot/Gelb/Grün/Blau, Dark: Pink/Türkis/Orange/Lila). Die Flip-Karte dreht alle Karten um. Dazu kommen +1, +5, Wild +2 und Wild +Farbe (der Nächste zieht, bis die Farbe kommt).</p></details>`;
 if(!G){A.innerHTML=`<div class="box"><h1>UNO<span>Online</span></h1>
  <label>Dein Name</label><input id="nm" maxlength="14" value="${esc(name)}">
  <p class="mut">Alle Karten aus UNO No Mercy und UNO Flip in einem Deck.</p>
  <button class="pri" data-a="new">Neues Spiel erstellen</button>
  <div class="or">oder</div>
  <label>Spielcode</label><input id="cd" maxlength="4" placeholder="z. B. KQXT" style="text-transform:uppercase">
  <button data-a="join">Beitreten</button><p id="msg" class="mut"></p>${rules}</div>`;return}
 const head=`<div class="top"><h1>UNO<span>${esc(G.code)}</span></h1><button data-a="leave">Verlassen</button></div>`;
 const pls=G.players.map((p,i)=>{const n=(G.hands[p.id]||[]).length;return `<div class="pl ${p.out?'out':''} ${G.status==='playing'&&i===G.turn?'on':''}">${esc(p.name)}${p.id===uid?' (du)':''}${G.status==='lobby'?'':`<b class="${n>=20?'w':''}">${n}</b>`}</div>`}).join('');
 if(G.status==='lobby'){seen.h=seen.d=seen.s=0;seen.c={};seen.k=0;seen.o={};seen.col='';seen.afk=0;
  A.innerHTML=head+`<p class="mut">Modus: ${G.mode==='flip'?'UNO Flip':G.mode==='nm'?'UNO No Mercy':'No Mercy + Flip'}. Teile diesen Code mit deinen Freunden (2 bis 8 Spieler):</p><div class="code">${esc(G.code)}</div><div class="pls">${pls}</div>`+
   (G.host===uid?`<button class="pri" data-a="start" ${G.players.length<2?'disabled':''}>Spiel starten</button>`:'<p class="status mut">Warte auf den Start durch den Host …</p>')+'<p id="msg" class="mut"></p>'+rules;return}
 const top=G.discard.at(-1),my=G.hands[uid]||[],playing=G.status==='playing',mine=playing&&G.players[G.turn].id===uid,out=G.players.find(p=>p.id===uid)?.out;
 const has=my.some(c=>can(G,c));const sn={...seen};const cnt={};G.players.forEach(p=>cnt[p.id]=(G.hands[p.id]||[]).length);seen.h=my.length;seen.d=G.discard.length;seen.s=G.side;seen.c=cnt;seen.k=G.deck.length;const od={};G.players.forEach(p=>{od[p.id]=!!p.out;if(sn.d&&p.out&&sn.o[p.id]===false)popup(p.id===uid?'Du bist ausgeschieden':p.name+' scheidet aus','25 Karten erreicht – Mercy-Regel')});seen.o=od;if(G.afk&&G.afk.t!==sn.afk&&sn.d)popup(G.afk.name+' ist AFK','+'+G.afk.n+' Karten und Zug übersprungen');seen.afk=G.afk?G.afk.t:0;if(sn.d&&sn.col&&sn.col!==G.color)flash(G.color);seen.col=G.color;document.body.classList.toggle('warn',my.length>=20);
 const meI=Math.max(0,G.players.findIndex(p=>p.id===uid)),np=G.players.length;
 const seats=G.players.map((p,i)=>{const k=(i-meI+np)%np,a=(90+k*360/np)*Math.PI/180,c=cnt[p.id],m=Math.min(c,12);
  const fan=p.id===uid?'':Array.from({length:m},(_,j)=>`<i class="mc" style="--r:${(j-m/2)*7}deg"></i>`).join('');
  return `<div class="seat ${i===G.turn&&G.status==='playing'?'on':''} ${p.out?'out':''}" id="s-${i}" style="left:${50+43*Math.cos(a)}%;top:${50+41*Math.sin(a)}%"><div class="fan">${fan}</div><div class="pl">${esc(p.name)}${p.id===uid?' (du)':''}<b class="${c>=20?'w':''}">${c}</b><span class="tmr"></span></div></div>`}).join('');document.documentElement.style.setProperty('--cur','var(--'+G.color+')');
 const status=!playing?`🎉 ${esc(G.winner)} hat gewonnen!`:out?'Du bist ausgeschieden (25+ Karten)':mine?'Du bist dran!':`${esc(G.players[G.turn].name)} ist dran …`;
 const dr=G.pen>0?'pen':'draw';
 let pick='';
 if(pending?.k==='col')pick=`<div class="status">Wähle eine Farbe:</div><div class="pick">${(G.side?'PTOU':'RYGB').split('').map(c=>`<button data-a="col" data-c="${c}" style="--c:var(--${c})" aria-label="${COL[c]}"></button>`).join('')}</div>`;
 if(pending?.k==='tgt')pick=`<div class="status">Mit wem tauschen?</div><div class="pick">${G.players.filter(p=>!p.out&&p.id!==uid).map(p=>`<button class="t" data-a="tgt" data-p="${esc(p.id)}">${esc(p.name)} (${G.hands[p.id].length})</button>`).join('')}</div>`;
 A.innerHTML=head+`<div class="arena"><div class="felt ${G.side?'dark':''} ${sn.d&&sn.s!==G.side?'flip':''}"><svg class="ring ${G.dir<0?'rev':''}"><ellipse></ellipse></svg>
  <div class="mid"><button id="pile" data-a="${dr}" ${mine&&!G.drew?'':'disabled'}><div class="card sp a" style="--cx:0;--cy:0"><b class="pn">${G.pen>0?'+'+G.pen:''}</b></div></button>
  <div class="tc ${sn.d&&G.discard.length!==sn.d?'pop':''}">${face(top,1)}</div>
  <div class="info">${G.side?'🌑 Dark':'☀️ Light'}<br><span class="dot" style="background:var(--${G.color})"></span><br>${COL[G.color]}</div></div></div>${seats}</div>`+
  (playing&&G.pen>0?`<div class="banner">Strafe: +${G.pen} – mit beliebiger Zieh-Karte stapeln, sonst ziehen</div>`:'')+
  `<div class="status ${mine?'me':''}">${status}</div>`+pick+
  `<div class="hand" style="--n:${my.length}">${my.map((c,i)=>`<button class="${i>=sn.h?'in':''}" style="--i:${Math.min(i-sn.h,10)};--k:${i-(my.length-1)/2}" data-a="play" data-i="${i}" ${mine&&can(G,c)&&!pending?'':'disabled'}>${face(c)}</button>`).join('')}</div>`+
  (G.status==='done'&&G.host===uid?'<button class="pri" data-a="start">Neue Runde</button>':'')+
  `<p id="msg" class="mut"></p>`;flights(sn,cnt);fitRing();tick();
}

$('#app').addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;const a=b.dataset.a;
 if(a==='new'){if(getName()){const abc='ABCDEFGHJKLMNPQRSTUVWXYZ';await enter(Array.from({length:4},()=>abc[Math.random()*abc.length|0]).join(''),mode)}}
 else if(a==='join'){const c=($('#cd').value||'').trim();if(getName()){if(c.length!==4)msg('Bitte gib den 4-stelligen Code ein');else await enter(c,false)}}
 else if(a==='mode'){mode=b.dataset.m;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b))}
 else if(a==='start')await start();
 else if(a==='draw')await drawOne();
 else if(a==='pen')await takePen();
 else if(a==='play'){const i=+b.dataset.i,c=G.hands[uid][i];
  if(fc(G,c).c==='W'){pending={k:'col',i};render()}
  else if(G.mode!=='flip'&&c.v==='7'&&G.players.filter(p=>!p.out).length>1){pending={k:'tgt',i};render()}
  else await play(i)}
 else if(a==='col'){const i=pending.i;pending=null;await play(i,{col:b.dataset.c})}
 else if(a==='tgt'){const i=pending.i;pending=null;await play(i,{p:b.dataset.p})}
 else if(a==='leave'){seen.h=seen.d=seen.s=0;seen.c={};seen.k=0;seen.o={};seen.col='';seen.afk=0;unsub&&unsub();unsub=null;G=null;pending=null;render()}
});

/* ---------- Eigener Backend-Ersatz (WebSocket) statt Claude-Datenbank ---------- */
let ws, reqId = 0, off = 0;
const pend = {}, subs = {};
function connect() {
  return new Promise(res => {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
    ws.onopen = () => { Object.keys(subs).forEach(p => ws.send(JSON.stringify({ t: 'sub', path: p }))); res(); };
    ws.onmessage = e => {
      const m = JSON.parse(e.data); if (m.now) off = m.now - Date.now();
      if (m.t === 'res') { pend[m.id]?.(m.data); delete pend[m.id]; }
      else if (m.t === 'doc') subs[m.path]?.(m.data);
    };
    ws.onclose = () => setTimeout(connect, 1500);
    ws.onerror = () => res();
  });
}
const rpc = msg => new Promise((ok, fail) => {
  if (!ws || ws.readyState !== 1) return fail(new Error('offline'));
  const id = ++reqId; pend[id] = ok; ws.send(JSON.stringify({ ...msg, id }));
});
const snap = d => ({ exists: d != null, data: () => d });
const mkDb = () => ({
  doc: path => ({
    get: async () => snap(await rpc({ t: 'get', path })),
    set: (d, ifV) => rpc({ t: 'set', path, data: d, ifV }),
    onSnapshot: cb => {
      subs[path] = d => cb(snap(d));
      if (ws.readyState === 1) ws.send(JSON.stringify({ t: 'sub', path }));
      return () => { delete subs[path]; if (ws.readyState === 1) ws.send(JSON.stringify({ t: 'unsub', path })); };
    }
  })
});

(async () => {
  try { uid = localStorage.getItem('uno-uid'); } catch (e) {}
  if (!uid) { uid = (crypto.randomUUID && crypto.randomUUID()) || String(Math.random()).slice(2); try { localStorage.setItem('uno-uid', uid); } catch (e) {} }
  await connect();
  db = mkDb();
  render();
})();
